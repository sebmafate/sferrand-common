# When a version tag (v1.2.3) is pushed: builds, tests, packs, and publishes a GitHub release with the .nupkg files attached.
# The push to nuget.org only happens when the secret NUGET_API_KEY (an API key scoped to the SFerrand.* packages) is defined. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}   # a step condition can only read the job's env: empty means no push to nuget.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer computes the version from the tags: it needs the whole history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag (expected vMAJOR.MINOR.PATCH[-prerelease])"; exit 1
          fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack src/SFerrand.Common --configuration Release --no-build --output artifacts

      - name: Check the package version matches the tag
        shell: bash
        run: |
          test -f "artifacts/SFerrand.Common.${VERSION}.nupkg" || { echo "::error::expected artifacts/SFerrand.Common.${VERSION}.nupkg, got:"; ls artifacts; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The notes are the section of CHANGELOG.md for this version.
          awk -v v="${VERSION}" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          prerelease=""; [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

      - name: Push to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
